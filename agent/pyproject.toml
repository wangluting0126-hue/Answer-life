[project]
name = "answerlife"
version = "0.1.0"
description = "答案之书 Agent：情感陪伴与一起读书的个人 Agent。终端、网页、IM 三个入口。"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "anthropic>=2.0",
    "openai>=1.40.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
feishu = ["lark-oapi>=1.4.0"]
dingtalk = ["dingtalk-stream>=0.20"]
dev = ["pytest>=8.3.0"]

[project.scripts]
answerlife = "answerlife.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/answerlife"]

[tool.pytest.ini_options]
testpaths = ["tests"]
